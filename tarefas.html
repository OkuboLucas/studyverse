<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tarefas | StudyVerse</title>
</head>
<body>
    <header>
        <h1>STUDYVERSE</h1>
        <p>Organização, tarefas e desenvolvimento</p>
    </header>
    <main>
    <a href="index.html" class="back-link">Voltar ao Início</a>
    <section class="card" id="tarefas">
        <h2>Minhas Tarefas</h2>

        <p>
            Organize suas tarefas, acompanhe os prazos e consulte
            o status de conclusão de cada atividade em um só lugar.
        </p>
    </section>
<section class="card" id="formulario-tarefa">
    <h2>Adicionar nova tarefa</h2>
    <form id="form-tarefa">
        <div class="input-container">
        <label for="nome-tarefa">Nome da tarefa</label>
        <input
            type="text"
            id="nome-tarefa"
            placeholder="Ex.: Estudar lógica programação"
            required
        >
        </div>
        <div class="input-container">
            <label for="prioridade-tarefa">Prioridade</label>
            <select id="prioridade-tarefa">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>
        </div>
        <div class="input-container">
            <label for="prazo-tarefa">Prazo</label>
            <input 
                type="date"
                id="prazo-tarefa"
            >
        </div>
        <button type="submit">
            <span>Adicionar Tarefa</span>
            <span class="btn-glow"></span>
        </button>
    </form>
</section>

<section class="card" id="lista-tarefas">
    <h2>Minhas atividades</h2>
    <div class="tarefas-resumo">

        <div class="resumo-item">
            <span id="total-tarefas">0</span>
            <small>Total</small>
        </div>

        <div class="resumo-item">
            <span id="tarefas-concluidas">0</span>
            <small>Concluídas</small>
        </div>

        <div class="resumo-item">
            <span id="tarefas-pendentes">0</span>
            <small>Pendentes</small>
        </div>
    </div>

    <ul id="tarefas-lista"></ul>
</section>
</main>
    <script src="script.js"></script>
</body>
</html>
